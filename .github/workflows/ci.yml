name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust Core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Build Rust workspace
        run: cargo build --manifest-path rust/Cargo.toml --workspace

      - name: Set up Python reference
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python reference dependencies
        run: python -m pip install -e .

      - name: Verify Rust to Python project JSON compatibility
        run: python scripts/test_rust_json_compat.py

  evaluate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run evaluation
        run: python scripts/evaluate.py

      - name: Run all regression tests
        run: python -m unittest discover -s tests

  windows-build:
    runs-on: windows-latest
    needs: [rust-core, evaluate]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Prepare environment
        shell: pwsh
        run: python -m venv .venv
      - name: Build and smoke-test distribution
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HyperDotEditor-windows-x64
          path: |
            dist/HyperDotEditor-windows-x64.zip
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
