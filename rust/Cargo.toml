[workspace]
members = ["crates/hyper-dot-core", "crates/hyper-dot-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"

[profile.release]
# 大きさと速度の測定結果に基づく設定。根拠は docs/design/release-distribution.md の「サイズ方針」。
lto = true
codegen-units = 1
strip = true
panic = "abort"
