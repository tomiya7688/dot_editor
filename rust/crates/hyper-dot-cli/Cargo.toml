[package]
name = "hyper-dot-cli"
version = "0.1.0"
description = "Shell-first command line for Hyper Dot projects, backed by the Rust core"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "hyper_dot_cli"
path = "src/lib.rs"

[[bin]]
name = "pixel-cli"
path = "src/main.rs"

[[bin]]
name = "cli-anything-dot-editor"
path = "src/bin/cli-anything-dot-editor.rs"

[dependencies]
hyper-dot-core = { path = "../hyper-dot-core" }
serde_json = "1.0"

[target."cfg(windows)".dependencies]
winapi-util = "0.1.11"
