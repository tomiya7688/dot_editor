[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-dot-editor"
version = "0.1.0"
description = "Layered pixel editor with a reusable backend and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Pillow>=10.0,<13"]

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[project.scripts]
pixel-cli = "pixel_cli:main"

[project.gui-scripts]
dot-editor = "dot_editor:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["hyper_dot_editor_help"]
py-modules = ["dot_editor", "pixel_cli", "pixel_commands", "pixel_backend", "pixel_layers", "resolution_field", "canvas_cursor", "stroke", "command_catalog", "help_content", "recent_files"]

# 生成済みのコマンド表。ビルドの前に scripts/render_command_catalog.py python --out src/hyper_dot_editor_help で作る。
[tool.setuptools.package-data]
hyper_dot_editor_help = ["COMMANDS.md", "commands.json"]

[tool.ruff]
required-version = "==0.17.2"
target-version = "py310"
line-length = 100
force-exclude = true
extend-exclude = ["tools", "build", "dist", "vendor", "generated", ".venv*", "*.egg-info"]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = false
