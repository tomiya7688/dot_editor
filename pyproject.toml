[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-dot-editor"
version = "0.1.0"
description = "Layered pixel editor with a reusable backend and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Pillow>=10.0,<13"]

[project.scripts]
pixel-cli = "pixel_cli:main"

[project.gui-scripts]
dot-editor = "dot_editor:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["dot_editor", "pixel_cli", "pixel_commands", "pixel_backend", "pixel_layers", "resolution_field"]
